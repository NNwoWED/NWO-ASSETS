[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nwoassets"
version = "0.1.0"
description = "CLI read-only para inspecionar a base customizada Tibia 8.60 do projeto NWO MAPS"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nwoassets = "nwoassets.cli:main"

[tool.setuptools.packages.find]
include = ["nwoassets*"]

